<!DOCTYPE html>
<html lang="en">
<head>
    <title>Inline Formatting</title>
</head>
<body>

    <!-- Creative paragraph using multiple inline elements -->
    <p>
        <strong>Learning HTML</strong> is an
        <em>exciting journey</em> for every beginner.
        <mark>Practice regularly</mark> to improve your skills.
        <small>Keep learning every day.</small><br>
        Build something new and enjoy the process!
    </p>

</body>
</html>
