<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="responsive_css_cheat_sheet.css">
</head>
<body>

    <main>

        <h1>Responsive CSS Cheat Sheet</h1>

        <section class="cheat-sheet">

            <article>
                <h2>Filters</h2>
                <p>filter: grayscale(100%);</p>
            </article>

            <article>
                <h2>Media Queries</h2>
                <p>@media (max-width: 700px) { ... }</p>
            </article>

            <article>
                <h2>Responsive Design</h2>
                <p>Use flexible layouts for different screen sizes.</p>
            </article>

            <article>
                <h2>Typography</h2>
                <p>font-size: clamp(1rem, 2vw, 1.5rem);</p>
            </article>

        </section>

    </main>

</body>
</html>
