<!DOCTYPE html>
<html lang="en">
<head>

    <title>Responsive Cards</title>
    <link rel="stylesheet" href="responsive_cards_media_queries.css">
</head>
<body>

    <main>
        <h1>Responsive Cards</h1>

        <section class="cards">

            <article class="card">

            <article class="card">

            <article class="card">

            <article class="card">

                <p>One-dimensional layout system.</p>
            </article>

        </section>
    </main>

</html>
