<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="filter_cards_animation.css">
</head>
<body>

    <main>

        <h1>Profile Cards</h1>

        <section class="profiles">

            <article class="profile">
                <img class="gray" src="https://i.pravatar.cc/400?img=12" alt="Alex">
                <h2>Alex</h2>
                <p>Web Developer</p>
            </article>

            <article class="profile">
                <img class="sepia" src="https://i.pravatar.cc/400?img=32" alt="Sam">
                <h2>Sam</h2>
                <p>UI Designer</p>
            </article>

            <article class="profile">
                <img class="gray" src="https://i.pravatar.cc/400?img=47" alt="Jordan">
                <h2>Jordan</h2>
                <p>Cloud Engineer</p>
            </article>

        </section>

    </main>

</body>
</html>
