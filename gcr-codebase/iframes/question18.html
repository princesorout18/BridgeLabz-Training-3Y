<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Quotations</title>
</head>
<body>

    <h1>HTML Quotations</h1>

    <!-- Blockquote is used for a long quotation -->
    <blockquote>
        Learning HTML is an important first step in web development.
        It helps us understand how web pages are structured using
        elements and tags such as &lt;p&gt; and &lt;h1&gt;.
    </blockquote>

    <p>
        My teacher always says,
        <q>Practice makes you better.</q>
    </p>

</body>
</html>
