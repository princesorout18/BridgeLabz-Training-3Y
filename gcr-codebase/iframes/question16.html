<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>

    <h1>URI Encoding</h1>

    <p>Original URL:</p>

    <p>
        https://example.com/search?query=HTML & CSS
    </p>

    <p>Encoded URL:</p>

    <!-- Space is represented using %20 -->
    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search HTML & CSS
    </a>

</body>
</html>
