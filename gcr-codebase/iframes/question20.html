<!DOCTYPE html>
<html lang="en">

<head>

    <!--
        The title specifies the name displayed
        in the browser tab.
    -->
    <title>Important Head Elements</title>

    <!--
        The charset specifies the character encoding
        used by the webpage.
    -->
    <meta charset="UTF-8">

    <!--
        The description provides a short description
        of the webpage.
    -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements.">

    <!--
        The author specifies who created the webpage.
    -->
    <meta
        name="author"
        content="Prince">

    <!--
        The base tag specifies the base URL for
        relative URLs used in the webpage.
    -->
    <base href="https://example.com/">

    <!--
        The link tag is commonly used to connect
        external resources such as a favicon.
    -->
    <link
        rel="icon"
        href="favicon.ico">

    <!--
        The style tag contains CSS.
        It is empty here because the assignment
        requires only HTML.
    -->
    <style>
    </style>

    <!--
        The script tag is used to include JavaScript.
        It is empty here as required by the assignment.
    -->
    <script>
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This page demonstrates important elements
        that can be placed inside the HTML head section.
    </p>

</body>
</html>
