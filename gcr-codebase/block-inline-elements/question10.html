```html
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Travel Selection</title>
</head>
<body>

    <h1>Select Your Travel Preferences</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>Australia</option>
    </select>

    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Haryana</option>
        <option>Rajasthan</option>
        <option>Goa</option>
    </select>

    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
        <option>Delhi</option>
    </select>

    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Red Fort</option>
        <option>Gateway of India</option>
        <option>Goa Beaches</option>
    </select>

    <!-- Summary -->
    <p>
        My selected country is India, my state is Uttar Pradesh,
        my city is Mathura, and my favorite tourist place is the Taj Mahal.
    </p>

</body>
</html>
```
