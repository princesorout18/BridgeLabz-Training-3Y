```html
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Course Registration</title>
</head>
<body>

    <h1>Course Registration Form</h1>

    <!-- Registration form -->
    <form>

        <!-- Grouping student information -->
        <fieldset>
            <legend>Student Information</legend>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="java">Java Programming</option>
                <option value="html">HTML and Web Development</option>
                <option value="python">Python Programming</option>
                <option value="aws">Cloud Computing</option>
            </select>
            <br><br>

            <input type="submit" value="Register">

        </fieldset>

    </form>

    <!-- Course schedule table -->
    <h2>Available Course Schedule</h2>

    <table border="1">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10:00 AM</td>
            <td>Mr. Sharma</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>12:00 PM</td>
            <td>Ms. Singh</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>2:00 PM</td>
            <td>Mr. Verma</td>
        </tr>
    </table>

</body>
</html>
