<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="Q5_pricing.css">
</head>
<body>

    <main>

        <h1>Choose Your Plan</h1>

        <section class="plans">

            <article class="plan">
                <h2>Basic</h2>

                <p class="price">₹299/month</p>

                <ul>
                    <li>5 Projects</li>
                    <li>10 GB Storage</li>
                    <li>Email Support</li>
                </ul>

                <a href="#">Choose Plan</a>
            </article>

            <article class="plan popular">
                <h2>Standard</h2>

                <p class="price">₹599/month</p>

                <ul>
                    <li>15 Projects</li>
                    <li>50 GB Storage</li>
                    <li>Priority Support</li>
                </ul>

                <a href="#">Choose Plan</a>
            </article>

            <article class="plan">
                <h2>Premium</h2>

                <p class="price">₹999/month</p>

                <ul>
                    <li>Unlimited Projects</li>
                    <li>200 GB Storage</li>
                    <li>24/7 Support</li>
                </ul>

                <a href="#">Choose Plan</a>
            </article>

        </section>

    </main>

</body>
</html>
