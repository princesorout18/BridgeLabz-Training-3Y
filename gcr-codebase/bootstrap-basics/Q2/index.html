<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light text-dark">

    <header class="text-center mt-4 mb-3">
        <h1 class="fw-bold">Prince Sorout</h1>
        <p class="lead">Cloud & DevOps Enthusiast</p>
    </header>

    <main>

        <section class="container text-center p-5">

            <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80"
                class="img-fluid rounded-circle profile-img"
                alt="Profile">

            <h2 class="mt-4 fw-bold">Hello, I'm Prince</h2>

            <p class="mt-3">
                I enjoy building modern websites and exploring cloud
                technologies and DevOps tools.
            </p>

            <div class="mt-4">
                <a href="#" class="btn btn-primary me-2">
                    Hire Me
                </a>

                <a href="#" class="btn btn-outline-dark">
                    Download CV
                </a>
            </div>

            <!-- Contact form -->
            <div class="row justify-content-center mt-5">
                <div class="col-md-7">

                    <h3 class="mb-3">Contact Me</h3>

                    <form>
                        <input type="text"
                            class="form-control mb-3"
                            placeholder="Your Name">

                        <input type="email"
                            class="form-control mb-3"
                            placeholder="Your Email">

                        <textarea
                            class="form-control mb-3"
                            rows="4"
                            placeholder="Your Message"></textarea>

                        <button class="btn btn-dark">
                            Send Message
                        </button>
                    </form>

                </div>
            </div>

        </section>

    </main>

    <footer class="text-center bg-dark text-white p-3">
        <p class="mb-0">© 2026 Prince Sorout</p>
    </footer>

</body>
</html>
