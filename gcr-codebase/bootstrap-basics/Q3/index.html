<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="bg-dark text-white text-center p-4">
        <h1>Tech Store</h1>
        <p class="mb-0">Quality products at great prices</p>
    </header>

    <main class="container py-5">

        <h2 class="text-center mb-5">Our Products</h2>

        <!-- Bootstrap row and responsive columns -->
        <div class="row g-4">

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?auto=format&fit=crop&w=500&q=80"
                        class="card-img-top"
                        alt="Laptop">

                    <div class="card-body text-center">
                        <h5>Laptop</h5>
                        <p class="text-primary fw-bold">₹55,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=500&q=80"
                        class="card-img-top"
                        alt="Smartphone">

                    <div class="card-body text-center">
                        <h5>Smartphone</h5>
                        <p class="text-primary fw-bold">₹24,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
                        class="card-img-top"
                        alt="Headphones">

                    <div class="card-body text-center">
                        <h5>Headphones</h5>
                        <p class="text-primary fw-bold">₹3,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
                        class="card-img-top"
                        alt="Smart Watch">

                    <div class="card-body text-center">
                        <h5>Smart Watch</h5>
                        <p class="text-primary fw-bold">₹5,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 Tech Store</p>
    </footer>

</body>
</html>
