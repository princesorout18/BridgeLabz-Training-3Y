<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechNova - Startup</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header with Bootstrap navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">TechNova</a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>

        <!-- Hero section -->
        <section class="hero-section">
            <div class="container">
                <div class="row align-items-center min-vh-75">

                    <div class="col-lg-7 text-center text-lg-start">
                        <h1 class="display-3 fw-bold">
                            Build Your Future With TechNova
                        </h1>

                        <p class="lead mt-3">
                            We create innovative digital solutions that help
                            businesses grow faster and smarter.
                        </p>

                        <a href="#" class="btn btn-primary btn-lg mt-3">
                            Get Started
                        </a>
                    </div>

                    <div class="col-lg-5 text-center mt-4 mt-lg-0">
                        <img
                            src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=800&q=80"
                            class="img-fluid rounded shadow"
                            alt="Modern office">
                    </div>

                </div>
            </div>
        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 TechNova. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
