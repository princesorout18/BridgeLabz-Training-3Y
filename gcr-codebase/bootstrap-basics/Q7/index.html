<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Tracker</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="bg-primary text-white p-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="mb-0">Task Tracker</h1>

            <!-- Badge counter -->
            <span class="badge bg-light text-primary fs-6">
                Pending: 4
            </span>
        </div>
    </header>

    <main class="container py-5">

        <section>
            <h2 class="mb-4">My Tasks</h2>

            <!-- Bootstrap list group -->
            <div class="list-group">

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Complete project documentation</span>
                    <span class="badge bg-danger">High</span>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Submit assignment</span>
                    <span class="badge bg-warning text-dark">Medium</span>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Read Bootstrap documentation</span>
                    <span class="badge bg-success">Low</span>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Prepare presentation</span>
                    <span class="badge bg-danger">High</span>
                </div>

            </div>

            <!-- Completed button with badge -->
            <button class="btn btn-success mt-4">
                Completed
                <span class="badge bg-light text-success">3</span>
            </button>

        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 Task Tracker</p>
    </footer>

</body>
</html>
